[package]
name = "cajeta-bench-axum"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "ws"] }
hyper = { version = "=1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
bytes = "1"
reqwest = { version = "=0.13.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
