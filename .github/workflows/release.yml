name: release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Builds the library .cja on every PR; on a v* tag also publishes a GitHub
# Release and a signed publish to Olla. Logic lives in the reusable workflow.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Toolchain that can compile this repo (0.9.x language + the scoped
      # bare-name resolution fix). The reusable workflow's default (v0.7.1)
      # predates both. Bump alongside future toolchain releases.
      cajeta-version: v0.9.3
    secrets: inherit
