name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Builds the library .cja on every PR; on a v* tag also publishes a GitHub
# Release and a signed publish to Olla. Logic lives in the reusable workflow.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Toolchain that can compile AND correctly run this repo. The reusable
      # workflow's default (v0.7.1) is far too old.
      #
      # FLOOR IS v0.10.1 — not a preference, a correctness requirement, for two
      # independent reasons:
      #
      # 1. Every release through v0.9.5 predates cajeta `f74298c4` ("a borrowed
      #    function-typed local must not drop the closure record"), without which
      #    a function-typed local that merely ALIASES a stored handler registers
      #    a SECOND drop for the shared closure record — double-free. The suite
      #    aborts deterministically (10/10) with `free(): invalid pointer` in
      #    `middleware bundle: live server (2.2a)`. v0.10.0 first carried it.
      # 2. These sources use bracket array literals `[1, 2, 3]`; v0.10.0 predates
      #    the collection-literals work entirely and cannot parse them.
      #
      # Raised to v0.12.1 with the unit-5 tour rewrite: the expanded tour is
      # authored and verified against the 0.12 line.
      #
      # Raised past v0.15.0, and again a correctness requirement. Commit f02c1f6
      # migrated this tree onto the cajeta v0.22 stdlib rename
      # `JsonValue.asArray()/asObject()` -> `array()/object()`, so the sources
      # now call `array()`/`object()`. Checked, not assumed:
      # `git show v0.15.0:runtime/src/cajeta/codec/json/JsonValue.cajeta` still
      # declares `asArray`/`asObject`. The old pin therefore could not compile
      # the sources it was aimed at, and every tagged run would have died in
      # `cajeta build` -- before reaching the Publish-to-Olla step the tag exists
      # to trigger. So v0.22 is the FLOOR.
      #
      # Raised to v0.28.0, a correctness requirement for the third time. The
      # suite and the tour bind nine tasks `Task<T> t #= spawn f()`. Before
      # v0.28.0 the spawn's own drop entry was never marked inactive under a
      # sharp binding -- the compiler unwrap missed the MoveExpression that `#=`
      # wraps the spawn in -- so both entries stayed armed and the Task was
      # freed twice, aborting the run in the drop chain. Verified rather than
      # assumed: the released binary is downloaded and the suite run against it
      # before the pin moves. Raise it the same way -- this line has already
      # shipped a pin that could not build the sources beneath it once.
      #
      # Raised to v0.29.0, a correctness requirement for the fourth time, and
      # this one closes the gap the 0.3.0 README had to name rather than fix.
      # `Http2Connection.run` spawns one handler fiber per stream in statement
      # position inside a scope that only exits when the CONNECTION closes, so
      # on v0.28.0 the scope frame kept the task and its entry for the whole
      # life of the connection. cajeta 4bcaef62 and 95cdac83 reap finished tasks
      # at registration, both in runtime/native/cajeta_rt_concurrent_sync.c, and
      # both are in v0.29.0.
      #
      # Measured on the released binary rather than read off those commits.
      # 3000 streams down one connection, watching the soak server's own
      # live-object print every 500. v0.28.0 climbs 883, 1371, 1891, 2379, 2867,
      # 3387, which is one object per request served. v0.29.0 is flat at 387,
      # 375, 395, 383, 371, 391. Same sources, same codec archive, only the
      # compiler differs, so the instrument fires on the old toolchain and does
      # not on the new one.
      #
      # scripts/ci-checks.sh is green on that binary with .cajeta/cache cleared
      # first: 1445 suite tests, 150 tour checks, 128 of 128 public types
      # covered. Raise it the same way.
      #
      # Raised to v0.30.0 for the ByteBuffer channel operations the 0.4.0 view
      # model reads and writes through. scripts/ci-checks.sh is green on the
      # released binary with .cajeta/cache cleared: 1445 suite tests, 150 tour
      # checks, 128 of 128 public types covered.
      cajeta-version: v0.30.0
      # Suite + tour + tour-coverage gate, chained in scripts/ci-checks.sh.
      # (`./run-tests.sh` rather than `cajeta test` because the suite needs the
      # codec's native zlib backend extracted out of its .cja with
      # CAJETA_NATIVE_PATH pointed at it; safe after the reusable workflow's own
      # `cajeta build`, which resolves dev.cajeta.codec into $OLLA_HOME.)
      test-command: ./scripts/ci-checks.sh
    secrets: inherit
